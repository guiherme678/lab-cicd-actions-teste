<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vai Palmeiras !</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      background: #7b2cbf;
      padding: 1rem;
    }
    .cartao {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
      text-align: center;
      color: #1d1d1f;
    }
    .emoji { font-size: 4rem; }
    h1 { margin: .5rem 0; color: #1e9e5a; }
    .versao {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 12px;
      background: #f2f2f7;
      text-align: left;
      line-height: 1.8;
    }
    code { background: #e5e5ea; padding: 2px 6px; border-radius: 6px; }
    footer { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e5e5ea; color: #6e6e73; font-size: .85rem; }
  </style>
  <style>
  body {
    transition: background-color 0.3s, color 0.3s;
  }

  body.modo-noturno {
    background-color: #121212;
    color: #f5f5f5;
  }

  body.modo-noturno button {
    background-color: #333;
    color: white;
    border: 1px solid #777;
  }

  #botao-tema {
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    margin: 10px 0;
  }
</style>
</head>
<body>
  <main class="cartao">
    <div class="emoji">💚</div>
    <h1>Vai Palmeiras!</h1>
    <p>VERDE, BRANCO E VERMELHO</p>
<button id="botao-tema">🌙 Ativar modo noturno</button>
    
    <div class="versao">
      🤖 <strong>Publicado pelo robô em:</strong> __DATA__<br>
      🔖 <strong>Commit:</strong> <code>__COMMIT__</code><br>
      👤 <strong>Enviado por:</strong> __AUTOR__
    </div>

    <footer>
      🎓 UNINOVE · Automação de Processos · DevOps<br>
      Prof. Marcelino Dias da Silva
    </footer>
  </main>
  <script>
  const botao = document.getElementById("botao-tema");

  botao.addEventListener("click", function () {
    document.body.classList.toggle("modo-noturno");

    if (document.body.classList.contains("modo-noturno")) {
      botao.textContent = "☀️ Ativar modo claro";
    } else {
      botao.textContent = "🌙 Ativar modo noturno";
    }
  });
</script>
</body>
</html>
